<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>待办清单</title>

<!-- PWA 配置 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3b82f6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="待办清单">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f0f6ff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
    /* 适配刘海屏 */
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
    padding-top: max(24px, env(safe-area-inset-top));
    padding-bottom: max(24px, env(safe-area-inset-bottom));
  }

  .container {
    width: 100%;
    max-width: 480px;
  }

  h1 {
    color: #2563eb;
    font-size: 24px;
    text-align: center;
    margin-bottom: 20px;
  }

  /* 输入区 */
  .input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .input-row input {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    border: 2px solid #bfdbfe;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
    background: #fff;
    transition: border-color .2s;
  }

  .input-row input:focus {
    border-color: #3b82f6;
  }

  .input-row button {
    padding: 0 20px;
    border: none;
    border-radius: 12px;
    background: #3b82f6;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    transition: background .2s;
  }

  .input-row button:active {
    background: #2563eb;
  }

  /* 任务列表 */
  .task-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .task {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fff;
    padding: 14px;
    border-radius: 12px;
    box-shadow: 0 1px 3px rgba(37, 99, 235, .08);
    animation: pop .2s ease;
  }

  @keyframes pop {
    from { transform: scale(.96); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  /* 自定义复选框 */
  .task input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    min-width: 22px;
    border: 2px solid #93c5fd;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .2s, border-color .2s;
  }

  .task input[type="checkbox"]::after {
    content: "";
    width: 12px;
    height: 6px;
    border-left: 2px solid #fff;
    border-bottom: 2px solid #fff;
    transform: rotate(-45deg) translateY(-1px);
    opacity: 0;
  }

  .task input[type="checkbox"]:checked {
    background: #3b82f6;
    border-color: #3b82f6;
  }

  .task input[type="checkbox"]:checked::after {
    opacity: 1;
  }

  .task span {
    flex: 1;
    font-size: 16px;
    color: #1e3a5f;
    word-break: break-all;
  }

  /* 已完成样式 */
  .task.done span {
    color: #9ca3af;
    text-decoration: line-through;
  }

  .task.done input[type="checkbox"] {
    border-color: #d1d5db;
    background: #d1d5db;
  }

  /* 删除按钮 */
  .task .del {
    border: none;
    background: none;
    color: #cbd5e1;
    font-size: 18px;
    cursor: pointer;
    padding: 4px 6px;
  }

  .task .del:active {
    color: #ef4444;
  }

  /* 空状态 */
  .empty {
    text-align: center;
    color: #93b8e8;
    padding: 32px 0;
    font-size: 15px;
  }

  /* 底部统计 */
  .footer {
    margin-top: 20px;
    text-align: center;
    color: #64748b;
    font-size: 14px;
    background: #fff;
    padding: 12px;
    border-radius: 12px;
    box-shadow: 0 1px 3px rgba(37, 99, 235, .08);
  }

  .footer b {
    color: #3b82f6;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>待办清单</h1>

    <div class="input-row">
      <input type="text" id="taskInput" placeholder="添加新任务..." maxlength="100">
      <button id="addBtn">添加</button>
    </div>

    <ul class="task-list" id="taskList"></ul>

    <div class="footer">未完成任务：<b id="count">0</b> 个</div>
  </div>

<script>
  const input = document.getElementById('taskInput');
  const addBtn = document.getElementById('addBtn');
  const list = document.getElementById('taskList');
  const count = document.getElementById('count');

  // 本地保存，刷新不丢失
  let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');

  function save() {
    localStorage.setItem('tasks', JSON.stringify(tasks));
  }

  function render() {
    list.innerHTML = '';

    if (tasks.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '还没有任务，快来添加一个吧～';
      list.appendChild(empty);
    }

    tasks.forEach((task, i) => {
      const li = document.createElement('li');
      li.className = 'task' + (task.done ? ' done' : '');

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = task.done;
      checkbox.addEventListener('change', () => {
        tasks[i].done = checkbox.checked;
        save();
        render();
      });

      const text = document.createElement('span');
      text.textContent = task.text;

      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '×';
      del.addEventListener('click', () => {
        tasks.splice(i, 1);
        save();
        render();
      });

      li.appendChild(checkbox);
      li.appendChild(text);
      li.appendChild(del);
      list.appendChild(li);
    });

    count.textContent = tasks.filter(t => !t.done).length;
  }

  function addTask() {
    const text = input.value.trim();
    if (!text) return;
    tasks.push({ text, done: false });
    input.value = '';
    save();
    render();
  }

  addBtn.addEventListener('click', addTask);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') addTask();
  });

  render();

  // 注册 Service Worker（仅在安全环境下生效）
  if ('serviceWorker' in navigator &&
      (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }
</script>
</body>
</html>
