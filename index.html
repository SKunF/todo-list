<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>待办清单</title>

<!-- PWA 配置 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#3b82f6">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="待办清单">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">

<style>
  :root {
    color-scheme: light;
    --bg: #eef4ff;
    --card: #ffffff;
    --text: #1e3a5f;
    --muted: #64748b;
    --sub: #9ca3af;
    --border: #bfdbfe;
    --border-soft: #e2e8f0;
    --soft: #eef4ff;
    --accent: #3b82f6;
    --accent-deep: #2563eb;
    --danger: #ef4444;
    --warn: #f59e0b;
    --shadow: rgba(37, 99, 235, .08);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0b1120;
      --card: #16213a;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --sub: #64748b;
      --border: #334155;
      --border-soft: #2a3a55;
      --soft: #1f2c47;
      --accent: #3b82f6;
      --accent-deep: #60a5fa;
      --shadow: rgba(0, 0, 0, .4);
    }
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding-top: max(16px, env(safe-area-inset-top));
    padding-bottom: max(24px, env(safe-area-inset-bottom));
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
    position: relative;
  }

  /* 背景光斑装饰 */
  body::before,
  body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }

  body::before {
    width: 300px;
    height: 300px;
    top: -80px;
    right: -80px;
    background: radial-gradient(circle, rgba(99, 102, 241, .22), transparent 70%);
  }

  body::after {
    width: 340px;
    height: 340px;
    bottom: -100px;
    left: -100px;
    background: radial-gradient(circle, rgba(59, 130, 246, .18), transparent 70%);
  }

  .container {
    width: 100%;
    max-width: 480px;
    position: relative;
    z-index: 1;
  }

  /* ===== 英雄区 ===== */
  .hero {
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #4f8dfd 0%, #3b82f6 45%, #6366f1 100%);
    border-radius: 22px;
    padding: 20px;
    color: #fff;
    margin-bottom: 16px;
    box-shadow: 0 10px 28px rgba(59, 130, 246, .35);
  }

  .hero::before,
  .hero::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, .12);
  }

  .hero::before {
    width: 160px;
    height: 160px;
    top: -70px;
    right: -40px;
  }

  .hero::after {
    width: 90px;
    height: 90px;
    bottom: -40px;
    right: 70px;
    background: rgba(255, 255, 255, .08);
  }

  .hero-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    position: relative;
    z-index: 1;
  }

  .hero-date {
    font-size: 12.5px;
    opacity: .85;
    letter-spacing: .5px;
  }

  .hero-title {
    font-size: 25px;
    font-weight: 700;
    margin-top: 3px;
  }

  .hero-settings {
    border: none;
    background: rgba(255, 255, 255, .18);
    color: #fff;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .2s, transform .3s;
  }

  .hero-settings:active {
    background: rgba(255, 255, 255, .3);
    transform: rotate(90deg);
  }

  .hero-bottom {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 16px;
    position: relative;
    z-index: 1;
  }

  .ring {
    width: 58px;
    height: 58px;
    flex: 0 0 auto;
  }

  .ring circle {
    fill: none;
    stroke-width: 6;
    stroke-linecap: round;
  }

  .ring-bg { stroke: rgba(255, 255, 255, .25); }

  .ring-fg {
    stroke: #fff;
    transform: rotate(-90deg);
    transform-origin: center;
    transition: stroke-dashoffset .6s cubic-bezier(.4, 0, .2, 1);
  }

  .hero-stats {
    font-size: 13.5px;
    opacity: .95;
    line-height: 1.5;
  }

  .hero-stats b {
    font-size: 19px;
    font-weight: 700;
  }

  /* ===== 搜索框 ===== */
  .search-box {
    display: flex;
    align-items: center;
    gap: 9px;
    background: var(--card);
    border: 2px solid transparent;
    border-radius: 14px;
    padding: 0 14px;
    margin-bottom: 14px;
    box-shadow: 0 1px 4px var(--shadow);
    transition: border-color .2s;
  }

  .search-box:focus-within {
    border-color: var(--accent);
  }

  .search-box svg {
    color: var(--sub);
    flex: 0 0 auto;
  }

  .search {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: none;
    padding: 12px 0;
    font-size: 15px;
    color: var(--text);
  }

  .search::placeholder { color: var(--sub); }

  /* ===== 分类 chips ===== */
  .chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 2px;
    margin-bottom: 14px;
    scrollbar-width: none;
  }

  .chips::-webkit-scrollbar { display: none; }

  .chip {
    flex: 0 0 auto;
    padding: 7px 16px;
    border-radius: 20px;
    border: 1.5px solid transparent;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: transform .15s, box-shadow .2s;
  }

  .chip:active { transform: scale(.94); }

  .chip.add-chip {
    border-style: dashed;
    color: var(--sub);
    background: var(--card);
    border-color: var(--border-soft);
  }

  /* ===== 输入区 ===== */
  .input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
  }

  .input-row input {
    flex: 1;
    min-width: 0;
    padding: 13px 15px;
    border: 2px solid transparent;
    border-radius: 14px;
    font-size: 16px;
    outline: none;
    background: var(--card);
    color: var(--text);
    box-shadow: 0 1px 4px var(--shadow);
    transition: border-color .2s;
  }

  .input-row input:focus {
    border-color: var(--accent);
  }

  .input-row button {
    padding: 0 22px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #4f8dfd, #3b82f6);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(59, 130, 246, .35);
    transition: transform .15s, filter .2s;
  }

  .input-row button:active {
    transform: scale(.95);
    filter: brightness(.95);
  }

  /* 优先级 + 日期行 */
  .options-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 18px;
  }

  .seg {
    display: flex;
    background: var(--card);
    border-radius: 11px;
    padding: 3px;
    gap: 2px;
    box-shadow: 0 1px 4px var(--shadow);
  }

  .seg button {
    border: none;
    background: none;
    padding: 6px 12px;
    border-radius: 9px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    transition: all .2s;
  }

  .seg button.active {
    background: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  input[type="date"] {
    flex: 0 0 auto;
    padding: 8px 11px;
    border-radius: 11px;
    border: none;
    background: var(--card);
    color: var(--text);
    font-size: 13px;
    outline: none;
    box-shadow: 0 1px 4px var(--shadow);
  }

  /* ===== 任务列表 ===== */
  .task-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .task {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    padding: 13px 14px 13px 18px;
    border-radius: 14px;
    box-shadow: 0 2px 6px var(--shadow);
    animation: rise .3s ease backwards;
    animation-delay: calc(var(--i) * 35ms);
    transition: transform .15s, box-shadow .2s;
  }

  .task:active {
    transform: scale(.985);
    box-shadow: 0 4px 12px var(--shadow);
  }

  @keyframes rise {
    from { transform: translateY(10px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }

  /* 优先级左侧色条 */
  .task::before {
    content: "";
    position: absolute;
    left: 7px;
    top: 14px;
    bottom: 14px;
    width: 4px;
    border-radius: 2px;
    background: transparent;
  }

  .task.pri1::before { background: var(--accent); }
  .task.pri2::before { background: var(--warn); }
  .task.pri3::before { background: var(--danger); }

  /* 自定义复选框 */
  .task input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    min-width: 22px;
    border: 2px solid #93c5fd;
    border-radius: 7px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .2s, border-color .2s, transform .12s;
  }

  .task input[type="checkbox"]:active {
    transform: scale(.82);
  }

  .task input[type="checkbox"]::after {
    content: "";
    width: 12px;
    height: 6px;
    border-left: 2px solid #fff;
    border-bottom: 2px solid #fff;
    transform: rotate(-45deg) translateY(-1px);
    opacity: 0;
    transition: opacity .15s;
  }

  .task input[type="checkbox"]:checked {
    background: var(--accent);
    border-color: var(--accent);
    animation: checkPop .25s ease;
  }

  @keyframes checkPop {
    0%   { transform: scale(.7); }
    60%  { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  .task input[type="checkbox"]:checked::after {
    opacity: 1;
  }

  .task .content {
    flex: 1;
    min-width: 0;
    cursor: pointer;
  }

  .task .line {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .p-dot {
    width: 8px;
    height: 8px;
    min-width: 8px;
    border-radius: 50%;
  }

  .task .text {
    font-size: 16px;
    word-break: break-all;
  }

  .task .badges {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 5px;
  }

  .task .badges:empty { display: none; }

  .badge {
    font-size: 11px;
    padding: 2.5px 9px;
    border-radius: 7px;
    font-weight: 500;
  }

  .badge.due {
    background: var(--soft);
    color: var(--accent-deep);
  }

  .badge.due.overdue {
    background: var(--danger);
    color: #fff;
    box-shadow: 0 2px 6px rgba(239, 68, 68, .3);
  }

  /* 已完成样式 */
  .task.done {
    opacity: .75;
  }

  .task.done .text {
    color: var(--sub);
    text-decoration: line-through;
  }

  .task.done::before { background: transparent !important; }
  .task.done .badge { opacity: .55; }

  .task.done input[type="checkbox"] {
    border-color: #d1d5db;
    background: #d1d5db;
  }

  /* 删除按钮 */
  .task .del {
    border: none;
    background: none;
    color: #cbd5e1;
    font-size: 18px;
    cursor: pointer;
    padding: 4px 6px;
    transition: color .2s, transform .15s;
  }

  html:not(.dark) .task .del { color: #cbd5e1; }

  .task .del:active {
    color: var(--danger);
    transform: scale(1.2);
  }

  /* 拖拽占位 */
  .sortable-ghost {
    opacity: .4;
  }

  .sortable-chosen {
    box-shadow: 0 8px 20px var(--shadow) !important;
    transform: rotate(1deg);
  }

  /* 空状态 */
  .empty {
    text-align: center;
    padding: 26px 0 10px;
    color: var(--sub);
    font-size: 15px;
  }

  .empty svg {
    display: block;
    margin: 0 auto 10px;
    opacity: .9;
  }

  /* 底部统计 + 同步状态 */
  .footer {
    margin-top: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--muted);
    font-size: 14px;
    background: var(--card);
    padding: 13px 16px;
    border-radius: 14px;
    box-shadow: 0 1px 4px var(--shadow);
  }

  .footer b { color: var(--accent); }

  .sync-btn {
    border: none;
    background: none;
    color: var(--sub);
    font-size: 13px;
    cursor: pointer;
  }

  .sync-btn.ok { color: #10b981; }
  .sync-btn.err { color: var(--danger); }
  .sync-btn.busy { color: var(--warn); }

  /* ===== 弹窗 ===== */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, .5);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
  }

  .overlay.show { display: flex; }

  .modal {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border-radius: 20px 20px 0 0;
    padding: 14px 20px max(20px, env(safe-area-inset-bottom));
    animation: slideUp .28s cubic-bezier(.3, 1, .4, 1);
    max-height: 85vh;
    overflow-y: auto;
  }

  .modal::before {
    content: "";
    display: block;
    width: 36px;
    height: 4px;
    border-radius: 2px;
    background: var(--border-soft);
    margin: 0 auto 14px;
  }

  @keyframes slideUp {
    from { transform: translateY(60%); opacity: .4; }
    to   { transform: translateY(0); opacity: 1; }
  }

  .modal h3 {
    font-size: 17px;
    margin-bottom: 14px;
    color: var(--text);
  }

  .modal label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin: 12px 0 6px;
  }

  .modal input[type="text"],
  .modal input[type="date"],
  .modal input[type="password"],
  .modal select {
    width: 100%;
    padding: 11px 12px;
    border: 1.5px solid var(--border-soft);
    border-radius: 10px;
    font-size: 15px;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color .2s;
  }

  .modal input:focus, .modal select:focus {
    border-color: var(--accent);
  }

  .modal .btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 11px;
    background: linear-gradient(135deg, #4f8dfd, #3b82f6);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 14px;
    transition: transform .15s, filter .2s;
  }

  .modal .btn:active { transform: scale(.97); filter: brightness(.95); }

  .modal .btn.ghost {
    background: none;
    border: 1.5px solid var(--border-soft);
    color: var(--muted);
    font-weight: 500;
  }

  .modal .btn.danger {
    background: none;
    border: 1.5px solid var(--danger);
    color: var(--danger);
    font-weight: 500;
  }

  .hint {
    font-size: 12px;
    color: var(--sub);
    line-height: 1.7;
    background: var(--soft);
    padding: 10px 12px;
    border-radius: 10px;
    margin-bottom: 4px;
  }

  /* 分类管理列表 */
  .cat-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 4px;
    border-bottom: 1px solid var(--border-soft);
  }

  .cat-item .name { flex: 1; font-size: 15px; }

  .cat-item .del-cat {
    border: none;
    background: none;
    color: var(--danger);
    font-size: 13px;
    cursor: pointer;
  }

  .cat-add {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }

  .cat-add input {
    flex: 1;
  }

  .cat-add button {
    padding: 0 18px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #4f8dfd, #3b82f6);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="container">
    <!-- 英雄区 -->
    <div class="hero">
      <div class="hero-top">
        <div>
          <div class="hero-date" id="heroDate"></div>
          <div class="hero-title" id="heroGreet"></div>
        </div>
        <button class="hero-settings" id="settingsBtn" title="设置">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.08a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.08a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.08a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
      <div class="hero-bottom">
        <svg class="ring" viewBox="0 0 64 64">
          <circle class="ring-bg" cx="32" cy="32" r="26"/>
          <circle class="ring-fg" id="ringFg" cx="32" cy="32" r="26"/>
        </svg>
        <div class="hero-stats" id="heroStats"></div>
      </div>
    </div>

    <div class="search-box">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" class="search" placeholder="搜索任务...">
    </div>

    <div class="chips" id="chips"></div>

    <div class="input-row">
      <input type="text" id="taskInput" placeholder="添加新任务..." maxlength="100">
      <button id="addBtn">添加</button>
    </div>

    <div class="options-row">
      <div class="seg" id="priSeg">
        <button data-p="0" class="active">无</button>
        <button data-p="1">低</button>
        <button data-p="2">中</button>
        <button data-p="3">高</button>
      </div>
      <input type="date" id="dueInput" title="截止日期">
    </div>

    <ul class="task-list" id="taskList"></ul>

    <div class="footer">
      <span>未完成任务：<b id="count">0</b> 个</span>
      <button class="sync-btn" id="syncBtn">未配置同步</button>
    </div>
  </div>

  <!-- 编辑任务弹窗 -->
  <div class="overlay" id="editModal">
    <div class="modal">
      <h3>编辑任务</h3>
      <label>任务内容</label>
      <input type="text" id="editText" maxlength="100">
      <label>优先级</label>
      <div class="seg" id="editSeg">
        <button data-p="0" class="active">无</button>
        <button data-p="1">低</button>
        <button data-p="2">中</button>
        <button data-p="3">高</button>
      </div>
      <label>截止日期</label>
      <input type="date" id="editDue">
      <label>分类</label>
      <select id="editCat"></select>
      <button class="btn danger" id="deleteTaskBtn">删除任务</button>
      <button class="btn" id="saveTaskBtn">保存</button>
      <button class="btn ghost" data-close>取消</button>
    </div>
  </div>

  <!-- 分类管理弹窗 -->
  <div class="overlay" id="catModal">
    <div class="modal">
      <h3>分类管理</h3>
      <div id="catList"></div>
      <div class="cat-add">
        <input type="text" id="newCatName" placeholder="新分类名称" maxlength="10">
        <button id="addCatBtn">添加</button>
      </div>
      <button class="btn ghost" data-close>关闭</button>
    </div>
  </div>

  <!-- 同步设置弹窗 -->
  <div class="overlay" id="settingsModal">
    <div class="modal">
      <h3>云同步设置（LeanCloud）</h3>
      <div class="hint">
        1. 注册 LeanCloud（国内版 leancloud.cn 或国际版 console.leancloud.app），免费创建一个应用<br>
        2. 控制台 → 数据存储 → 创建 Class，名称填 TodoData（若已被自动创建则跳过）<br>
        3. 控制台 → 设置 → 应用凭证，把 AppID、AppKey、服务器地址复制到下面
      </div>
      <label>AppID</label>
      <input type="text" id="lcIdInput" placeholder="AppID">
      <label>AppKey</label>
      <input type="password" id="lcKeyInput" placeholder="AppKey">
      <label>服务器地址</label>
      <input type="text" id="lcServerInput" placeholder="如 https://xxxx.lc-cn-n1-shared.com">
      <button class="btn" id="saveSyncBtn">保存并同步</button>
      <button class="btn danger" id="clearSyncBtn">清除同步配置</button>
      <button class="btn ghost" data-close>关闭</button>
    </div>
  </div>

<script src="libs/Sortable.min.js"></script>
<script>
  /* ================= 工具 ================= */
  const $ = id => document.getElementById(id);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const CAT_COLORS = ['#3b82f6','#8b5cf6','#10b981','#f59e0b','#ef4444','#06b6d4','#ec4899','#84cc16'];
  const RING_C = 2 * Math.PI * 26;

  /* ================= 数据 ================= */
  let tasks = loadTasks();
  let categories = loadCategories();
  let activeCat = localStorage.getItem('activeCat') || '';
  let searchQ = '';
  let newPriority = 0;
  let localTs = +(localStorage.getItem('todo_ts') || 0);

  function loadTasks() {
    try {
      const raw = JSON.parse(localStorage.getItem('tasks') || '[]');
      if (raw.length && raw[0].id !== undefined) return raw;
      // 旧版本数据迁移
      return raw.map(t => ({ id: uid(), text: t.text, done: !!t.done, priority: 0, due: '', cat: '', created: Date.now() }));
    } catch (e) { return []; }
  }

  function loadCategories() {
    try {
      const c = JSON.parse(localStorage.getItem('todo_cats') || 'null');
      if (Array.isArray(c)) return c;
    } catch (e) {}
    return [
      { id: uid(), name: '工作' },
      { id: uid(), name: '生活' },
      { id: uid(), name: '购物' }
    ];
  }

  function saveLocal() {
    localStorage.setItem('tasks', JSON.stringify(tasks));
    localStorage.setItem('todo_cats', JSON.stringify(categories));
  }

  function dataChanged() {
    localTs = Date.now();
    localStorage.setItem('todo_ts', localTs);
    saveLocal();
    render();
    scheduleSync();
  }

  /* ================= 渲染 ================= */
  const listEl = $('taskList');

  function visibleTasks() {
    return tasks.filter(t =>
      (!activeCat || t.cat === activeCat) &&
      (!searchQ || t.text.toLowerCase().includes(searchQ))
    );
  }

  function catInfo(id) {
    const idx = categories.findIndex(c => c.id === id);
    return idx >= 0 ? { name: categories[idx].name, color: CAT_COLORS[idx % CAT_COLORS.length] } : null;
  }

  function fmtDue(d) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const dd = new Date(d + 'T00:00:00');
    const diff = Math.round((dd - today) / 86400000);
    if (diff === 0) return '今天';
    if (diff === 1) return '明天';
    if (diff === -1) return '昨天';
    return `${dd.getMonth() + 1}月${dd.getDate()}日`;
  }

  function isOverdue(t) {
    return t.due && !t.done && new Date(t.due + 'T23:59:59') < new Date();
  }

  /* 英雄区：日期、问候、进度环 */
  function renderHero() {
    const now = new Date();
    $('heroDate').textContent = now.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'long' });
    const h = now.getHours();
    $('heroGreet').textContent = h < 5 ? '夜深了，早点休息' : h < 11 ? '早上好 ☀' : h < 13 ? '中午好' : h < 18 ? '下午好' : '晚上好 🌙';

    const done = tasks.filter(t => t.done).length;
    const total = tasks.length;
    const fg = $('ringFg');
    fg.style.strokeDasharray = RING_C;
    fg.style.strokeDashoffset = total ? RING_C * (1 - done / total) : RING_C;
    $('heroStats').innerHTML = total
      ? `已完成 <b>${done}</b> / ${total}<br>还有 ${total - done} 个任务待完成`
      : '添加你的第一个任务吧';
  }

  function renderChips() {
    const chips = $('chips');
    chips.innerHTML = '';
    const mk = (id, name, active, color) => {
      const b = document.createElement('button');
      b.className = 'chip';
      b.textContent = name;
      if (active) {
        b.style.cssText = `background:${color};color:#fff;box-shadow:0 3px 10px ${color}55`;
      } else {
        b.style.cssText = `color:${color};background:${color}14;border-color:${color}45`;
      }
      b.onclick = () => { activeCat = id; localStorage.setItem('activeCat', id); render(); };
      chips.appendChild(b);
    };
    mk('', '全部', activeCat === '', CAT_COLORS[0]);
    categories.forEach((c, i) => mk(c.id, c.name, activeCat === c.id, CAT_COLORS[i % CAT_COLORS.length]));
    const plus = document.createElement('button');
    plus.className = 'chip add-chip';
    plus.textContent = '＋';
    plus.onclick = openCatModal;
    chips.appendChild(plus);
  }

  function renderList() {
    listEl.innerHTML = '';
    const vis = visibleTasks();

    if (vis.length === 0) {
      const empty = document.createElement('li');
      empty.className = 'empty';
      empty.innerHTML =
        '<svg width="84" height="84" viewBox="0 0 88 88" fill="none">' +
        '<rect x="18" y="12" width="52" height="64" rx="10" stroke="#93c5fd" stroke-width="3"/>' +
        '<rect x="30" y="6" width="28" height="12" rx="4" fill="#93c5fd"/>' +
        '<path d="M28 40l6 6 12-12" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>' +
        '<line x1="28" y1="58" x2="60" y2="58" stroke="#bfdbfe" stroke-width="3" stroke-linecap="round"/>' +
        '<line x1="28" y1="66" x2="50" y2="66" stroke="#bfdbfe" stroke-width="3" stroke-linecap="round"/>' +
        '</svg>' +
        (searchQ ? '没有匹配的任务' : '还没有任务，快来添加一个吧～');
      listEl.appendChild(empty);
    }

    vis.forEach((task, idx) => {
      const li = document.createElement('li');
      li.className = 'task' + (task.done ? ' done' : '') + (task.priority > 0 ? ' pri' + task.priority : '');
      li.dataset.id = task.id;
      li.style.setProperty('--i', idx);

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = task.done;
      checkbox.addEventListener('change', () => {
        task.done = checkbox.checked;
        dataChanged();
      });

      const content = document.createElement('div');
      content.className = 'content';

      const line = document.createElement('div');
      line.className = 'line';
      const text = document.createElement('span');
      text.className = 'text';
      text.textContent = task.text;
      line.appendChild(text);
      content.appendChild(line);

      const badges = document.createElement('div');
      badges.className = 'badges';
      if (task.due) {
        const due = document.createElement('span');
        due.className = 'badge due' + (isOverdue(task) ? ' overdue' : '');
        due.textContent = '📅 ' + fmtDue(task.due);
        badges.appendChild(due);
      }
      if (task.cat && !activeCat) {
        const info = catInfo(task.cat);
        if (info) {
          const cat = document.createElement('span');
          cat.className = 'badge';
          cat.style.cssText = `color:${info.color};background:${info.color}1c`;
          cat.textContent = info.name;
          badges.appendChild(cat);
        }
      }
      content.appendChild(badges);

      content.addEventListener('click', () => openEdit(task.id));

      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '×';
      del.addEventListener('click', () => {
        tasks = tasks.filter(t => t.id !== task.id);
        dataChanged();
      });

      li.appendChild(checkbox);
      li.appendChild(content);
      li.appendChild(del);
      listEl.appendChild(li);
    });

    $('count').textContent = tasks.filter(t => !t.done).length;
  }

  function render() {
    renderHero();
    renderChips();
    renderList();
  }

  /* ================= 拖拽排序 ================= */
  let sortable = null;
  function initSortable() {
    if (!window.Sortable || sortable) return;
    sortable = Sortable.create(listEl, {
      animation: 150,
      delay: 200,           // 触摸长按 200ms 才开始拖拽，避免误触
      delayOnTouchOnly: true,
      filter: 'input,button,.empty',
      preventOnFilter: false,
      ghostClass: 'sortable-ghost',
      chosenClass: 'sortable-chosen',
      onEnd(e) {
        if (e.oldIndex === e.newIndex) return;
        const vis = visibleTasks();
        if (!vis[e.oldIndex]) return;
        const moved = vis[e.oldIndex];
        vis.splice(e.oldIndex, 1);
        vis.splice(e.newIndex, 0, moved);
        const visSet = new Set(vis.map(t => t.id));
        const res = []; let vi = 0;
        for (const t of tasks) {
          if (visSet.has(t.id)) res.push(vis[vi++]);
          else res.push(t);   // 被过滤隐藏的任务保持在原相对位置
        }
        tasks = res;
        dataChanged();
      }
    });
  }

  /* ================= 弹窗通用 ================= */
  function show(ov) { ov.classList.add('show'); }
  function hide(ov) { ov.classList.remove('show'); }
  document.querySelectorAll('.overlay').forEach(ov => {
    ov.addEventListener('click', e => { if (e.target === ov) hide(ov); });
  });
  document.querySelectorAll('[data-close]').forEach(b => {
    b.addEventListener('click', e => hide(e.target.closest('.overlay')));
  });

  /* ================= 优先级选择器 ================= */
  function setSeg(el, v) {
    el.querySelectorAll('button').forEach(b => b.classList.toggle('active', +b.dataset.p === v));
  }
  function bindSeg(el, onPick) {
    el.querySelectorAll('button').forEach(b =>
      b.addEventListener('click', () => { setSeg(el, +b.dataset.p); onPick(+b.dataset.p); })
    );
  }
  bindSeg($('priSeg'), v => { newPriority = v; });

  /* ================= 添加任务 ================= */
  function addTask() {
    const input = $('taskInput');
    const text = input.value.trim();
    if (!text) return;
    tasks.push({
      id: uid(), text, done: false,
      priority: newPriority,
      due: $('dueInput').value || '',
      cat: activeCat,
      created: Date.now()
    });
    input.value = '';
    $('dueInput').value = '';
    newPriority = 0;
    setSeg($('priSeg'), 0);
    dataChanged();
  }
  $('addBtn').addEventListener('click', addTask);
  $('taskInput').addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

  /* ================= 搜索 ================= */
  $('searchInput').addEventListener('input', e => {
    searchQ = e.target.value.trim().toLowerCase();
    renderList();
  });

  /* ================= 编辑任务 ================= */
  let editId = null;
  let editPriority = 0;
  bindSeg($('editSeg'), v => { editPriority = v; });

  function openEdit(id) {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    editId = id;
    editPriority = t.priority;
    $('editText').value = t.text;
    $('editDue').value = t.due;
    setSeg($('editSeg'), t.priority);
    const sel = $('editCat');
    sel.innerHTML = '<option value="">未分类</option>';
    categories.forEach(c => {
      const o = document.createElement('option');
      o.value = c.id; o.textContent = c.name;
      sel.appendChild(o);
    });
    sel.value = t.cat || '';
    show($('editModal'));
  }

  $('saveTaskBtn').addEventListener('click', () => {
    const t = tasks.find(x => x.id === editId);
    if (t) {
      const text = $('editText').value.trim();
      if (text) t.text = text;
      t.priority = editPriority;
      t.due = $('editDue').value || '';
      t.cat = $('editCat').value || '';
    }
    hide($('editModal'));
    dataChanged();
  });

  $('deleteTaskBtn').addEventListener('click', () => {
    tasks = tasks.filter(t => t.id !== editId);
    hide($('editModal'));
    dataChanged();
  });

  /* ================= 分类管理 ================= */
  function openCatModal() {
    renderCatList();
    show($('catModal'));
  }

  function renderCatList() {
    const wrap = $('catList');
    wrap.innerHTML = '';
    categories.forEach((c, i) => {
      const row = document.createElement('div');
      row.className = 'cat-item';
      const dot = document.createElement('span');
      dot.className = 'p-dot';
      dot.style.background = CAT_COLORS[i % CAT_COLORS.length];
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = c.name;
      const del = document.createElement('button');
      del.className = 'del-cat';
      del.textContent = '删除';
      del.onclick = () => {
        if (!confirm(`删除分类「${c.name}」？该分类下的任务将变为未分类。`)) return;
        categories = categories.filter(x => x.id !== c.id);
        tasks.forEach(t => { if (t.cat === c.id) t.cat = ''; });
        if (activeCat === c.id) { activeCat = ''; localStorage.setItem('activeCat', ''); }
        dataChanged();
        renderCatList();
      };
      row.appendChild(dot);
      row.appendChild(name);
      row.appendChild(del);
      wrap.appendChild(row);
    });
  }

  function addCategory() {
    const inp = $('newCatName');
    const name = inp.value.trim();
    if (!name) return;
    if (categories.some(c => c.name === name)) { inp.value = ''; return; }
    categories.push({ id: uid(), name });
    inp.value = '';
    dataChanged();
    renderCatList();
  }
  $('addCatBtn').addEventListener('click', addCategory);
  $('newCatName').addEventListener('keydown', e => { if (e.key === 'Enter') addCategory(); });

  /* ================= 云同步（LeanCloud REST） ================= */
  const SYNC_KEY = 'todo_list_data';

  function lcConf() {
    return {
      id: localStorage.getItem('lc_id') || '',
      key: localStorage.getItem('lc_key') || '',
      server: (localStorage.getItem('lc_server') || '').replace(/\/+$/, '')
    };
  }
  function lcReady() {
    const c = lcConf();
    return !!(c.id && c.key && c.server);
  }
  function lcHeaders() {
    const c = lcConf();
    return { 'X-LC-Id': c.id, 'X-LC-Key': c.key, 'X-LC-Prod': '1', 'Content-Type': 'application/json' };
  }

  function setSyncStatus(text, cls) {
    const b = $('syncBtn');
    b.textContent = text;
    b.className = 'sync-btn' + (cls ? ' ' + cls : '');
  }

  async function fetchRemote() {
    const where = encodeURIComponent(JSON.stringify({ key: SYNC_KEY }));
    const r = await fetch(`${lcConf().server}/1.1/classes/TodoData?where=${where}`, { headers: lcHeaders() });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    return (j.results && j.results[0]) || null;
  }

  async function pushRemote(obj) {
    const body = JSON.stringify({ key: SYNC_KEY, data: JSON.stringify({ tasks, categories }), ts: localTs });
    let r;
    if (obj && obj.objectId) {
      r = await fetch(`${lcConf().server}/1.1/classes/TodoData/${obj.objectId}`, { method: 'PUT', headers: lcHeaders(), body });
    } else {
      r = await fetch(`${lcConf().server}/1.1/classes/TodoData`, { method: 'POST', headers: lcHeaders(), body });
    }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  }

  let remoteCache = null;

  async function sync() {
    if (!lcReady()) { setSyncStatus('未配置同步', ''); return; }
    setSyncStatus('同步中…', 'busy');
    try {
      const remote = await fetchRemote();
      remoteCache = remote;
      const remoteTs = remote ? (remote.ts || 0) : 0;
      if (remoteTs > localTs) {
        // 远端更新 → 拉取覆盖本地
        const d = JSON.parse(remote.data);
        if (Array.isArray(d.tasks)) tasks = d.tasks;
        if (Array.isArray(d.categories)) categories = d.categories;
        saveLocal();
        localTs = remoteTs;
        localStorage.setItem('todo_ts', localTs);
        render();
      } else {
        // 本地更新 → 推送到云端
        remoteCache = await pushRemote(remote || remoteCache);
        localTs = Date.now();
        localStorage.setItem('todo_ts', localTs);
      }
      setSyncStatus('已同步 ' + new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }), 'ok');
    } catch (e) {
      setSyncStatus('同步失败', 'err');
      console.warn('同步失败:', e);
    }
  }

  let syncTimer = null;
  function scheduleSync() {
    clearTimeout(syncTimer);
    syncTimer = setTimeout(sync, 2000);
  }

  /* ================= 设置弹窗 ================= */
  function openSettings() {
    const c = lcConf();
    $('lcIdInput').value = c.id;
    $('lcKeyInput').value = c.key;
    $('lcServerInput').value = c.server;
    show($('settingsModal'));
  }
  $('settingsBtn').addEventListener('click', openSettings);
  $('syncBtn').addEventListener('click', openSettings);

  $('saveSyncBtn').addEventListener('click', () => {
    localStorage.setItem('lc_id', $('lcIdInput').value.trim());
    localStorage.setItem('lc_key', $('lcKeyInput').value.trim());
    localStorage.setItem('lc_server', $('lcServerInput').value.trim());
    hide($('settingsModal'));
    sync();
  });

  $('clearSyncBtn').addEventListener('click', () => {
    ['lc_id', 'lc_key', 'lc_server'].forEach(k => localStorage.removeItem(k));
    remoteCache = null;
    hide($('settingsModal'));
    setSyncStatus('未配置同步', '');
  });

  /* ================= 初始化 ================= */
  render();
  initSortable();
  if (lcReady()) sync();
  // 回到前台时拉取其他设备的更新
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && lcReady()) sync();
  });
</script>
</body>
</html>
